workflows:
  android-release:
    name: Android - Play Store
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        # Create this group in Codemagic (Teams > your team > Environment
        # variable groups) with: CM_KEYSTORE (base64 of your .jks file),
        # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD,
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (Play Console API service
        # account JSON, for automatic publishing — optional).
        - braves_android_signing
      node: 20
      vars:
        PACKAGE_NAME: "com.braves.bimfield"
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/keystore.jks
          cat >> "$CM_BUILD_DIR/android/keystore.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/keystore.jks
          EOF
      - name: Build Android release (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - robarbosa301@gmail.com
      # Uncomment once GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is set up (see
      # https://docs.codemagic.io/yaml-publishing/google-play/) to publish
      # straight to the Play Console's internal testing track.
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal

  ios-release:
    name: iOS - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: braves_app_store_connect # name this in Codemagic > Teams > Integrations
    environment:
      node: 20
      vars:
        BUNDLE_ID: "com.braves.bimfield"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.braves.bimfield
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - robarbosa301@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Set to true once you're ready to submit for App Store review
        # instead of just TestFlight.
        submit_to_app_store: false
